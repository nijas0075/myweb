    <title>Document</title>
    <style>
        *{

        }
         .navbar{

            display: flex;

            background-color: rgb(9, 9, 37);
            padding: 15px;
            align-items: center;
            height: 60px;
            color: white;

        .logo{

        }
        .links a{
            color: white;

        }
        .links a:hover{
            color: yellow;
        }
        .ww{

            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            color: white;

        }
        .ww:hover{

            color: yellow;
        }
        .qq{
            text-align: center;
            margin-top: 120px;
           margin-left: 20px;

        }

        form{
            width: 520px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 12px rgb(0,0,0,0.08);


        }

         input[type="text"],input[type="email"],input[type="tel"]{
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            box-sizing:border-box;
        }

        textarea{
            resize: none;
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            box-sizing:border-box;
        }
        .nn{
            width: 100%;
            padding:12px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button[type="submit"]{

            color: white;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
            
        }
        p{
            margin-bottom: 30px;
        }

        .cont{
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }
        .box1{
            width: 220px;
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgb(0,0,0,0.1);
        }
        .box1 img{
            width: 40px;
            float:none;
            margin-bottom: 20px;
        }
    </style>
</head>

        <input type="tel" name="tellphone" placeholder="Phone Number"><br><br>
